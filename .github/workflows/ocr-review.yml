name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'COLLABORATOR'
          || github.event.comment.author_association == 'CONTRIBUTOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
          || startsWith(github.event.comment.body, '/ocr')
          || startsWith(github.event.comment.body, '/review')
        )
      )
      && format('ocr-{0}', github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Run only on human-authored comments from contributors/maintainers on a PR
    # starting with trigger keywords (/open-code-review, @open-code-review, /ocr, /review).
    # Automatic runs on PR open/synchronize are intentionally disabled.
    if: |
      github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && (
        github.event.comment.author_association == 'OWNER'
        || github.event.comment.author_association == 'MEMBER'
        || github.event.comment.author_association == 'COLLABORATOR'
        || github.event.comment.author_association == 'CONTRIBUTOR'
      )
      && (
        startsWith(github.event.comment.body, '/open-code-review')
        || startsWith(github.event.comment.body, '@open-code-review')
        || startsWith(github.event.comment.body, '/ocr')
        || startsWith(github.event.comment.body, '/review')
      )
    steps:
      - name: Acknowledge comment with reaction
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes'
              });
            } catch (err) {
              core.info(`Could not add reaction: ${err.message}`);
            }

      - name: Get PR context
        id: pr-context
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('title', pullRequest.title);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@533f7367cdf064fe84c6b05ddbc5ab4fa90a8d38
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          background: ${{ steps.pr-context.outputs.title }}
