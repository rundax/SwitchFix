name: Spell Checker Follow-up

# Plan 05a follow-ups on hosted runners, which start without downloaded spelling data:
# - does macOS install a language's spelling data once its keyboard layout is enabled?
# - does the v0.0.13 build find its dictionaries with Swift 6.4 (#14)?
on:
  push:
    branches:
      - "spike/system-spellchecker"
    paths:
      - ".github/workflows/spellchecker-followup.yml"

permissions:
  contents: read

env:
  # Every language the spike report measures; enabling a layout installs its spelling data.
  PROBE_LANGUAGES: uk ru bg el he ar hi de fr es it pt_PT pl cs tr sv nl hu ro fi da nb lt sl vi

jobs:
  spelling-data:
    # Earlier pushes of this job showed that enabling a layout alone makes macOS install its
    # spelling data within a minute; this run measures every language with its data installed.
    name: Spelling data installed (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-26]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the spike
        run: swift build -c release --product SpellCheckerSpike

      - name: Before
        run: |
          mkdir -p spike-results
          sw_vers | tee spike-results/environment.txt
          .build/release/SpellCheckerSpike control $PROBE_LANGUAGES | tee spike-results/control-before.txt

      - name: Enable every measured layout
        run: .build/release/SpellCheckerSpike enable-layouts $PROBE_LANGUAGES | tee spike-results/enable.txt

      - name: Wait up to 10 minutes for the spelling data
        run: |
          for round in $(seq 1 20); do
            assets=$(find /System/Library/AssetsV2/com_apple_MobileAsset_LinguisticData* -maxdepth 3 -name 'Spelling-*.bundle' 2>/dev/null | sed 's#.*/Spelling-##; s#\.bundle##' | sort | tr '\n' ' ')
            control=$(.build/release/SpellCheckerSpike control $PROBE_LANGUAGES)
            echo "$(date -u +%H:%M:%S) $control assets: ${assets:-none}" | tee -a spike-results/poll.txt
            case "$control" in *"=100.0%"*) ;; *) echo "all probed dictionaries real"; break ;; esac
            sleep 30
          done

      - name: Measure with the spelling data installed
        run: .build/release/SpellCheckerSpike report --output spike-results/report.md

      - name: Benchmark corpus v2 with the system spell checker
        run: |
          for split in development holdout; do
            set +e
            swift run -c release LayoutBenchmark run \
              --adapter switchfix \
              --split "$split" \
              --profile boundary-layout-only \
              --corpus Benchmarks/layout-corpus/v2 \
              --dictionary-backend system \
              --baseline Benchmarks/baselines/v2/corpus-v2/baseline.json \
              --output "spike-results/system-$split" > "spike-results/system-$split.log" 2>&1
            status=$?
            set -e
            echo "system $split exit=$status" | tee -a spike-results/gates.txt
          done

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spelling-data-installed-${{ matrix.runner }}
          path: spike-results/
          if-no-files-found: ignore

  swift-6-4-build:
    name: App build with Swift 6.4 (${{ matrix.ref }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: [master, fix/v0.0.13-bug-reports]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Show toolchain environment
        run: |
          swift --version
          sw_vers

      - name: Build the app
        env:
          SWITCHFIX_CODESIGN_IDENTITY: "-"
        run: bash scripts/build-app.sh

      - name: Show the dictionary bundle layout
        run: find dist/SwitchFix.app/Contents/Resources/SwitchFix_Dictionary.bundle -maxdepth 3 | sort

      - name: Load every dictionary from the packaged app
        # master predates --verify-dictionaries; its layout above shows where the .bin files went.
        if: matrix.ref != 'master'
        run: |
          scripts/test-dictionary-bundle.sh
          dist/SwitchFix.app/Contents/MacOS/SwitchFixApp --verify-dictionaries
