name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run optimized input pipeline and dictionary checks
        # Keep performance assertions meaningful by avoiding debug-build overhead.
        run: |
          swift run -c release InputPipelineTestRunner
          swift run -c release TestRunner

      - name: Determine architecture label
        run: |
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            echo "ASSET_ARCH=arm64" >> "$GITHUB_ENV"
          elif [ "$ARCH" = "x86_64" ]; then
            echo "ASSET_ARCH=intel" >> "$GITHUB_ENV"
          else
            echo "Unsupported architecture: $ARCH"
            exit 1
          fi
          echo "Runner architecture: $ARCH"

      - name: Build and verify free ad-hoc app
        env:
          SWITCHFIX_CODESIGN_IDENTITY: "-"
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          [ "$APP_VERSION" = "$TAG_VERSION" ] || {
            echo "Tag v$TAG_VERSION must match app version $APP_VERSION." >&2
            exit 1
          }
          [ "$APP_BUILD" -ge 10 ] || {
            echo "Refusing to publish an app without guided permission setup." >&2
            exit 1
          }
          chmod +x scripts/build-app.sh
          scripts/build-app.sh
          codesign --verify --deep --strict dist/SwitchFix.app
          SIGNATURE="$(codesign -dv --verbose=4 dist/SwitchFix.app 2>&1)"
          TEAM="$(printf '%s\n' "$SIGNATURE" | sed -n 's/^TeamIdentifier=//p')"
          FLAGS="$(printf '%s\n' "$SIGNATURE" | sed -n 's/^CodeDirectory .* flags=\([^ ]*\) .*/\1/p')"
          [ "$TEAM" = "not set" ] && [[ "$FLAGS" == *"(adhoc)"* ]] || {
            echo "The release must use an ad-hoc signature; no Apple signing account is used." >&2
            exit 1
          }

      - name: Package app bundle
        run: ditto -c -k --keepParent dist/SwitchFix.app "dist/SwitchFix-${ASSET_ARCH}.app.zip"

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp "dist/SwitchFix-${ASSET_ARCH}.app.zip" release-assets/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ env.ASSET_ARCH }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Show collected assets
        run: ls -la release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*.zip
          generate_release_notes: true
